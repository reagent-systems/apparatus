[project]
name = "apparatus-server"
version = "0.1.0"
description = "Session server: client sockets, smart-model loop, tokens, ledger."
requires-python = ">=3.11"
dependencies = [
  "apparatus-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.54.0",
  "websockets>=13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "google-genai>=1.0",
  "PyJWT[crypto]>=2.8",
]

[project.scripts]
apparatus-server = "apparatus_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apparatus_server"]

[tool.uv.sources]
apparatus-protocol = { workspace = true }
