<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>apparatus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>
// Theme and borders before first paint: the localStorage copies of
// "apparatus.theme" (light | dark; absent = system) and "apparatus.borders"
// (off; absent = on). ThemeProvider re-applies both from the bridge's
// secure store once the app boots.
(function () {
  var root = document.documentElement;
  var t = null;
  try { t = localStorage.getItem("apparatus.theme"); } catch (e) {}
  var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  root.classList.toggle("dark", dark);
  var b = null;
  try { b = localStorage.getItem("apparatus.borders"); } catch (e) {}
  if (b === "off") root.setAttribute("data-borders", "off");
  else root.removeAttribute("data-borders");
})();
</script>
</head>
<body>
<div id="app"></div>
<script src="/bridge.js"></script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
