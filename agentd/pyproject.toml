[project]
name = "agentd"
version = "0.1.0"
description = "VM daemon: one Python kernel per task, tool execution, event stream to the server."
requires-python = ">=3.11"
dependencies = [
  "apparatus-protocol",
  "websockets>=13",
]

[project.scripts]
agentd = "agentd.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentd", "agentlib"]

[tool.uv.sources]
apparatus-protocol = { workspace = true }
