[package]
name = "apparatus-desktop"
version = "0.1.0"
description = "Apparatus desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "apparatus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keychain: Keychain on macOS, Credential Manager on Windows, Secret
# Service over D-Bus on Linux (needs libdbus-1-dev at build time).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
