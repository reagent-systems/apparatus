name: clients-watchos

on:
  workflow_call: {}
  workflow_dispatch: {}
  pull_request:
    paths:
      - "apps/watchos/**"
      - "packages/gate-vectors/gate-vectors.json"
      - ".github/workflows/clients-watchos.yml"

permissions:
  contents: read

concurrency:
  group: clients-watchos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/watchos
    env:
      # Step `if:` cannot read `secrets`; this flag can.
      HAVE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.WATCHOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      LOG_DIR: ${{ github.workspace }}/apps/watchos/build/logs
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          mkdir -p "$LOG_DIR"
          xcodegen --version
          xcodebuild -version
          xcodegen generate

      - name: Build for the watchOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ApparatusWatch.xcodeproj \
            -scheme ApparatusWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$LOG_DIR/build-simulator.log"

      - name: Pick a watchOS Simulator
        run: |
          set -euo pipefail
          # The newest watchOS runtime on the runner, its first available device.
          WATCH_SIM="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.rsplit("watchOS", 1)[1])]
          runtimes = sorted((r for r in devices if "watchOS" in r and devices[r]), key=version)
          if not runtimes:
              sys.exit("no watchOS simulator on this runner")
          print(devices[runtimes[-1]][0]["udid"])
          ')"
          xcrun simctl list devices | grep "$WATCH_SIM"
          echo "WATCH_SIM=$WATCH_SIM" >> "$GITHUB_ENV"

      - name: Test the app (gate vectors, orb mapping, reply latch, outbox)
        run: |
          set -o pipefail
          xcodebuild \
            -project ApparatusWatch.xcodeproj \
            -scheme ApparatusWatch \
            -destination "id=$WATCH_SIM" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$LOG_DIR/test-app.log"

      - name: Test ThinkingOrbsKit (golden vectors)
        working-directory: apps/watchos/Vendor/ThinkingOrbsKit
        run: |
          set -o pipefail
          SCHEME="$(xcodebuild -list -json | python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["workspace"]["schemes"]
          print("ThinkingOrbsKit-Package" if "ThinkingOrbsKit-Package" in schemes else "ThinkingOrbsKit")
          ')"
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "id=$WATCH_SIM" \
            -derivedDataPath "$GITHUB_WORKSPACE/apps/watchos/build/KitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$LOG_DIR/test-kit.log"

      - name: Import signing certificate and profile
        if: env.HAVE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.WATCHOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/apparatus-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/apparatus.p12"
          PROFILE="$RUNNER_TEMP/apparatus.mobileprovision"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "::add-mask::$PROFILE_UUID"

      - name: Archive for watchOS
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ApparatusWatch.xcodeproj \
            -scheme ApparatusWatch \
            -destination 'generic/platform=watchOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath build/ApparatusWatch.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive | tee "$LOG_DIR/archive.log"

      - name: Export .ipa
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:systems.reagent.apparatus.watch string $PROFILE_NAME" "$OPTIONS"
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/ApparatusWatch.xcarchive \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath build/export | tee "$LOG_DIR/export.log"
          ditto -c -k --keepParent build/ApparatusWatch.xcarchive build/export/ApparatusWatch.xcarchive.zip

      - name: Upload watchos artifact
        if: env.HAVE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchos
          path: |
            apps/watchos/build/export/*.ipa
            apps/watchos/build/export/ApparatusWatch.xcarchive.zip
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watchos-build-logs
          path: apps/watchos/build/logs/
          if-no-files-found: ignore

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH"
