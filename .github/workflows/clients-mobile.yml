# Build the Capacitor mobile shell for Android and iOS.
# Both jobs pass without secrets. Secrets add Firebase config and signing.
name: clients-mobile

on:
  workflow_call: {}
  workflow_dispatch: {}
  pull_request:
    paths:
      - "web/**"
      - "clients/mobile/**"
      - ".github/workflows/clients-mobile.yml"

permissions:
  contents: read

concurrency:
  group: clients-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variable. Empty means http://localhost:8080 (scripts/origin.mjs).
  APPARATUS_SERVER_ORIGIN: ${{ vars.APPARATUS_SERVER_ORIGIN }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: clients/mobile/android/**/*.gradle*

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            clients/mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install mobile dependencies
        run: npm ci

      - name: Build web client and bridge
        run: npm run prepare-dist

      - name: Sync Android project
        run: npx cap sync android

      # Without this file the google-services plugin is not applied
      # (android/app/build.gradle) and push stays off.
      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "wrote android/app/google-services.json"
          else
            echo "ANDROID_GOOGLE_SERVICES_JSON not set: push disabled"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: clients/mobile/android

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: clients/mobile/android
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set: no release APK"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          if-no-files-found: error
          path: |
            clients/mobile/android/app/build/outputs/apk/debug/*.apk
            clients/mobile/android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            clients/mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install mobile dependencies
        run: npm ci

      - name: Build web client and bridge
        run: npm run prepare-dist

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Write GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICE_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_PLIST }}
        run: |
          if [ -n "$IOS_GOOGLE_SERVICE_PLIST" ]; then
            printf '%s' "$IOS_GOOGLE_SERVICE_PLIST" > ios/App/App/GoogleService-Info.plist
            echo "wrote ios/App/App/GoogleService-Info.plist"
          else
            echo "IOS_GOOGLE_SERVICE_PLIST not set: no Firebase config"
          fi

      - name: Build for the simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived build CODE_SIGNING_ALLOWED=NO

      - name: Archive and export IPA
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "IOS_P12_BASE64 or IOS_PROVISIONING_PROFILE_BASE64 not set: no IPA"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/apparatus.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Set manual signing on the App target only. A global xcodebuild
          # override would also hit the Pods framework targets, and those
          # reject a provisioning profile.
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"; CODE_SIGN_IDENTITY = \"Apple Distribution\";/" \
            ios/App/App.xcodeproj/project.pbxproj

          EXPORT="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/ExportOptions.plist "$EXPORT"
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" \
            -c "Set :provisioningProfiles:systems.reagent.apparatus $PROFILE_NAME" "$EXPORT"

          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist "$EXPORT" -exportPath build/ipa

          security delete-keychain "$KEYCHAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          if-no-files-found: error
          path: |
            clients/mobile/build/derived/Build/Products/Debug-iphonesimulator/App.app
            clients/mobile/build/ipa/*.ipa
