# Release: on a version tag, verify, build every client for every platform, build the
# server and VM images, and publish one GitHub Release with all artifacts attached.
# The client workflows are reusable (workflow_call); each uploads named artifacts.
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: verify/verify.sh

  web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm ci && npm run build
      - run: cd web/dist && zip -r ../../apparatus-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apparatus-web.zip

  desktop:
    needs: verify
    uses: ./.github/workflows/clients-desktop.yml
    secrets: inherit

  mobile:
    needs: verify
    uses: ./.github/workflows/clients-mobile.yml
    secrets: inherit

  watchos:
    needs: verify
    uses: ./.github/workflows/clients-watchos.yml
    secrets: inherit

  wearos:
    needs: verify
    uses: ./.github/workflows/clients-wearos.yml
    secrets: inherit

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/server:latest
      - name: VM image (local development stand-in)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: vm/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/vm:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/vm:latest

  publish:
    needs: [verify, web, desktop, mobile, watchos, wearos, images]
    if: always() && needs.verify.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f | sort
      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'PY' > notes.md
          import re, pathlib
          text = pathlib.Path("agent-kit/CHANGELOG.md").read_text()
          tag = "${{ github.ref_name }}".lstrip("v")
          m = re.search(rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          print(m.group(1).strip() if m else "See agent-kit/CHANGELOG.md.")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/**/*
          fail_on_unmatched_files: false
