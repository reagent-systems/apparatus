# Build the Tauri desktop shell for Linux, Windows and macOS.
# Builds only. No release upload. Signing secrets are optional.
name: clients-desktop

on:
  workflow_call: {}
  workflow_dispatch: {}
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/desktop/**"
      - "packages/design/**"
      - "packages/orb/**"
      - "package-lock.json"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/clients-desktop.yml"

permissions:
  contents: read

concurrency:
  group: clients-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: ""
            args: "--config src-tauri/gen/server.conf.json"
          - os: windows-latest
            targets: ""
            args: "--config src-tauri/gen/server.conf.json"
          - os: macos-latest
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --config src-tauri/gen/server.conf.json"
    env:
      # Repository variable. Empty means http://localhost:8080 (scripts/origin.mjs).
      APPARATUS_SERVER_ORIGIN: ${{ vars.APPARATUS_SERVER_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      # One install at the root for every workspace. `npm ci` inside a workspace
      # folder would empty the root node_modules and keep only that workspace's deps.
      - name: Install dependencies
        run: npm ci

      - name: Generate icons when missing
        run: npm run icons
        working-directory: apps/desktop

      - name: Write server config
        run: npm run server-config
        working-directory: apps/desktop

      # Runs `tauri build`, which runs `npm run prepare-dist` first
      # (build.beforeBuildCommand in tauri.conf.json).
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
